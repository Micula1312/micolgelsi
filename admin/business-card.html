<!doctype html><html><head><meta charset="utf-8"><title>Business card editor</title><style>body{font:14px Helvetica;background:#111;color:white;padding:25px}label{display:block;margin:12px 0}input{padding:7px}#card{width:510px;height:330px;background:#050505;color:#39ff14;position:relative;padding:25px;box-sizing:border-box}h1{font:italic 60px Georgia;margin:65px 0 15px}a{color:inherit}#star{font-size:80px;position:absolute;right:25px;top:95px;text-decoration:none}button{padding:10px;margin:10px}@media print{body{padding:0;background:white}form,button{display:none}#card{width:85mm;height:55mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}h1{font-size:32px;margin:20px 0 10px}#star{font-size:44px;top:50px}}</style></head><body><h2>★ BUSINESS CARD / EDITOR</h2><form id="controls"><label>Name <input name="name" value="Micol Gelsi"></label><label>Role <input name="role" value="ARTIST / RESEARCHER"></label><label>Portfolio <input name="url" value="https://thearchiveoftheuntamed.xyz/portfolio/" size="55"></label><label>Green <input name="green" type="color" value="#39ff14"></label><label>Pink <input name="pink" type="color" value="#ff43b9"></label><label>Small text <input name="tag" value="#untamed"></label></form><button onclick="localStorage.setItem('business-card',JSON.stringify(Object.fromEntries(new FormData(document.querySelector('form')))))">Save preset</button><button onclick="window.print()">Export PDF / Print</button><div id="card"><small>MICOL GELSI / 2026</small><h1 id="n">Micol Gelsi</h1><div id="r">ARTIST / RESEARCHER</div><a id="star" target="_blank">★</a><p id="t" style="color:#ff43b9;font-style:italic">#untamed</p><small>ROME / BOLOGNA — CLICK STAR FOR PORTFOLIO</small></div><script>const f=document.querySelector('form');const saved=JSON.parse(localStorage.getItem('business-card')||'{}');for(const [k,v] of Object.entries(saved))if(f.elements[k])f.elements[k].value=v;function draw(){const x=f.elements;document.getElementById('n').textContent=x.name.value;document.getElementById('r').textContent=x.role.value;document.getElementById('star').href=x.url.value;document.getElementById('t').textContent=x.tag.value;document.getElementById('t').style.color=x.pink.value;document.getElementById('card').style.color=x.green.value}f.addEventListener('input',draw);draw()</script></body></html>
