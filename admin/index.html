<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio Admin</title>
<style>
:root{--bg:#080808;--fg:#f4f4f4;--muted:#858585;--line:#2d2d2d;--signal:#39ff14;--panel:#0e0e0e;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-size:13px}button,input,textarea,select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line)}button{cursor:pointer}button:hover{border-color:var(--signal);color:var(--signal)}input,textarea,select{width:100%;padding:8px}textarea{resize:vertical;min-height:72px}.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;height:100vh;overflow:hidden}.sidebar,.meta{border-right:1px solid var(--line);overflow:auto}.meta{border-right:0;border-left:1px solid var(--line)}.top{padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}.brand{font-family:var(--mono);font-size:12px}.brand b{color:var(--signal)}.project-list{padding:8px}.project-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:9px 6px}.project-item small{display:block;color:var(--muted);font-family:var(--mono);font-size:9px;margin-top:3px}.project-item.is-active{color:var(--signal)}.editor{overflow:auto}.editor-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}.editor-title{font-size:18px;margin:0}.actions{display:flex;gap:8px}.actions button{padding:7px 10px}.form{padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label,.section-title{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.research-box{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}.research-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;margin-top:9px}.research-option{display:flex;gap:7px;align-items:flex-start;font-size:11px}.research-option input{width:auto;margin-top:2px}.research-option small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.raw{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}.raw textarea{min-height:300px;font-family:var(--mono);font-size:11px;line-height:1.35}.meta section{padding:14px;border-bottom:1px solid var(--line)}.media-drop{border:1px dashed var(--line);padding:16px;text-align:center;color:var(--muted)}.media-drop.is-over{border-color:var(--signal);color:var(--signal)}.media-list{display:grid;gap:6px;margin-top:10px}.media-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:6px}.media-item span{overflow-wrap:anywhere;font-family:var(--mono);font-size:9px}.media-item button{padding:3px 6px}.categories{display:grid;gap:8px}.category-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}.category-row input{padding:6px}.new-project{display:grid;gap:8px}.status{font-family:var(--mono);font-size:9px;color:var(--muted);padding:7px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}.status.ok{color:var(--signal)}@media(max-width:900px){.app{grid-template-columns:180px minmax(0,1fr)}.meta{display:none}.form{grid-template-columns:1fr}.field.full,.research-box,.raw{grid-column:1}.research-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="top"><div class="brand"><b>★</b> PORTFOLIO ADMIN</div></div>
    <div class="project-list" id="projectList"></div>
  </aside>
  <main class="editor">
    <div class="editor-head">
      <h1 class="editor-title" id="editorTitle">Select a project</h1>
      <div class="actions"><button id="reloadBtn">reload</button><button id="saveBtn">save + import</button></div>
    </div>
    <div class="form" id="form" hidden>
      <div class="field full"><label>Title</label><input data-section="TITLE" /></div>
      <div class="field"><label>Type</label><input data-section="TYPE" /></div>
      <div class="field"><label>Author / collective</label><input data-section="AUTHOR" /></div>
      <div class="field"><label>Start</label><input data-section="START" placeholder="2026-09-05" /></div>
      <div class="field"><label>End</label><input data-section="END" placeholder="ongoing" /></div>
      <div class="field"><label>Status</label><select data-section="STATUS"><option value="">—</option><option value="ongoing">ongoing</option><option value="completed">completed</option></select></div>
      <div class="field"><label>Featured</label><select data-section="FEATURED"><option value="">no</option><option value="true">yes</option></select></div>
      <div class="field full"><label>Medium</label><input data-section="MEDIUM" placeholder="performance, installation, net art" /></div>
      <div class="field full"><label>Excerpt</label><textarea data-section="EXCERPT"></textarea></div>
      <div class="field full"><label>Description</label><textarea data-section="DESCRIPTION" style="min-height:160px"></textarea></div>
      <div class="field"><label>Main link</label><input data-section="MAIN LINK" /></div>
      <div class="field"><label>Avatar</label><input data-section="AVATAR" placeholder="avatar.mp4" /></div>
      <div class="field full"><label>Collaborators</label><input data-section="COLLABORATORS" /></div>
      <div class="field full"><label>Credits</label><input data-section="CREDITS" /></div>
      <div class="research-box"><div class="section-title">Research areas</div><div class="research-grid" id="researchGrid"></div></div>
      <div class="raw"><div class="section-title" style="margin-bottom:7px">Advanced / full info.txt</div><textarea id="rawInfo"></textarea></div>
    </div>
    <div class="status" id="status">ready</div>
  </main>
  <aside class="meta">
    <section>
      <div class="section-title" style="margin-bottom:9px">New project</div>
      <div class="new-project"><select id="newKind"><option value="artistic">artistic</option><option value="external">external</option></select><input id="newTitle" placeholder="Project title"/><input id="newSlug" placeholder="slug (optional)"/><button id="createBtn">create project</button></div>
    </section>
    <section>
      <div class="section-title" style="margin-bottom:9px">Media</div>
      <select id="mediaBucket"><option value="images">images</option><option value="videos">videos</option><option value="root">root / avatar / cover</option></select>
      <div class="media-drop" id="mediaDrop" style="margin-top:8px">drop files here<br/>or click<input id="mediaInput" type="file" multiple hidden></div>
      <div class="media-list" id="mediaList"></div>
    </section>
    <section>
      <div class="section-title" style="margin-bottom:9px">Research categories</div>
      <div class="categories" id="categories"></div>
      <div style="display:flex;gap:6px;margin-top:8px"><button id="addCategoryBtn">+ category</button><button id="saveCategoriesBtn">save categories</button></div>
    </section>
  </aside>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let projects=[],categories=[],current=null;
const status=(msg,ok=false)=>{const el=$('#status');el.textContent=msg;el.classList.toggle('ok',ok)};
const api=async(url,options={})=>{const res=await fetch(url,options);const data=await res.json();if(!res.ok)throw new Error(data.error||res.statusText);return data};
const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function loadProjects(){projects=await api('/api/projects');renderProjects();}
function renderProjects(){const host=$('#projectList');host.innerHTML='';for(const p of projects){const b=document.createElement('button');b.className='project-item'+(current?.slug===p.slug&&current?.kind===p.kind?' is-active':'');b.innerHTML=`${p.title}<small>${p.kind} / ${p.slug}</small>`;b.onclick=()=>openProject(p.kind,p.slug);host.appendChild(b);}}
async function loadCategories(){categories=await api('/api/categories');renderCategoryManager();renderResearch();}
function renderCategoryManager(){const host=$('#categories');host.innerHTML='';categories.forEach((c,i)=>{const row=document.createElement('div');row.className='category-row';row.innerHTML=`<input data-cat-key value="${c.key}"><input data-cat-label value="${c.label}"><button>×</button><input data-cat-subtitle style="grid-column:1/3" value="${c.subtitle||''}" placeholder="subtitle">`;row.querySelector('button').onclick=()=>{categories.splice(i,1);renderCategoryManager();renderResearch()};host.appendChild(row)});}
function syncCategoryInputs(){categories=$$('#categories .category-row').map(row=>({key:row.querySelector('[data-cat-key]').value.trim(),label:row.querySelector('[data-cat-label]').value.trim(),subtitle:row.querySelector('[data-cat-subtitle]').value.trim()})).filter(x=>x.key&&x.label)}
function renderResearch(){const host=$('#researchGrid');if(!host)return;const selected=new Set((current?.data?.RESEARCH||'').split(/[,;\n]/).map(x=>x.trim().toLowerCase()).filter(Boolean));host.innerHTML='';for(const c of categories){const wrap=document.createElement('label');wrap.className='research-option';wrap.innerHTML=`<input type="checkbox" value="${c.key}" ${selected.has(c.key)?'checked':''}><span>${c.label}<small>${c.subtitle||c.key}</small></span>`;host.appendChild(wrap)}}
async function openProject(kind,slug){status('loading…');current=await api(`/api/project?kind=${kind}&slug=${encodeURIComponent(slug)}`);$('#form').hidden=false;$('#editorTitle').textContent=current.data.TITLE||slug;$$('[data-section]').forEach(el=>el.value=current.data[el.dataset.section]||'');$('#rawInfo').value=current.text;renderProjects();renderResearch();renderMedia();status('loaded',true)}
function updateRawFromFields(){let text=$('#rawInfo').value;const sectionNames=$$('[data-section]').map(el=>el.dataset.section);const set=(name,value)=>{const lines=text.replace(/\r/g,'').split('\n');const re=new RegExp(`^${name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}:`);let start=lines.findIndex(l=>re.test(l));const block=[`${name}: ${String(value||'').split('\n')[0]||''}`,...String(value||'').split('\n').slice(1)];if(start<0){text=(text.trimEnd()?text.trimEnd()+'\n\n':'')+block.join('\n')+'\n';return}let end=start+1;while(end<lines.length&&!/^[A-Z][A-Z ]+:/.test(lines[end]))end++;lines.splice(start,end-start,...block);text=lines.join('\n')};$$('[data-section]').forEach(el=>set(el.dataset.section,el.value));const research=$$('#researchGrid input:checked').map(x=>x.value).join(', ');set('RESEARCH',research);return text.trimEnd()+'\n'}
async function save(){if(!current)return;status('saving + importing…');const text=updateRawFromFields();const data=await api('/api/project',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind:current.kind,slug:current.slug,text,import:true})});$('#rawInfo').value=data.text;await loadProjects();await openProject(current.kind,current.slug);status('saved + imported',true)}
function renderMedia(){const host=$('#mediaList');host.innerHTML='';for(const m of current?.media||[]){const row=document.createElement('div');row.className='media-item';row.innerHTML=`<span>${m.rel}</span><button>×</button>`;row.querySelector('button').onclick=async()=>{if(!confirm(`Delete ${m.rel}?`))return;await api(`/api/media?kind=${current.kind}&slug=${encodeURIComponent(current.slug)}&rel=${encodeURIComponent(m.rel)}`,{method:'DELETE'});await openProject(current.kind,current.slug)};host.appendChild(row)}}
async function uploadFiles(files){if(!current)return alert('Select a project first');const bucket=$('#mediaBucket').value;for(const file of files){status(`uploading ${file.name}…`);await api(`/api/media?kind=${current.kind}&slug=${encodeURIComponent(current.slug)}&bucket=${bucket}&name=${encodeURIComponent(file.name)}`,{method:'POST',body:file})}await openProject(current.kind,current.slug);status('media uploaded',true)}
$('#saveBtn').onclick=save;$('#reloadBtn').onclick=()=>current&&openProject(current.kind,current.slug);$('#createBtn').onclick=async()=>{const title=$('#newTitle').value.trim(),slug=$('#newSlug').value.trim()||slugify(title),kind=$('#newKind').value;if(!title)return;await api('/api/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,slug,kind})});$('#newTitle').value='';$('#newSlug').value='';await loadProjects();await openProject(kind,slug)};
$('#mediaDrop').onclick=()=>$('#mediaInput').click();$('#mediaInput').onchange=e=>uploadFiles(e.target.files);['dragenter','dragover'].forEach(ev=>$('#mediaDrop').addEventListener(ev,e=>{e.preventDefault();$('#mediaDrop').classList.add('is-over')}));['dragleave','drop'].forEach(ev=>$('#mediaDrop').addEventListener(ev,e=>{e.preventDefault();$('#mediaDrop').classList.remove('is-over')}));$('#mediaDrop').addEventListener('drop',e=>uploadFiles(e.dataTransfer.files));
$('#addCategoryBtn').onclick=()=>{syncCategoryInputs();categories.push({key:'new-category',label:'New category',subtitle:''});renderCategoryManager()};$('#saveCategoriesBtn').onclick=async()=>{syncCategoryInputs();const data=await api('/api/categories',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({categories})});categories=data.categories;renderCategoryManager();renderResearch();status('categories saved',true)};
Promise.all([loadProjects(),loadCategories()]).then(()=>status('ready',true)).catch(e=>status(e.message));
</script>
</body>
</html>
